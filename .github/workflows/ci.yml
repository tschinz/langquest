name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install exercise toolchains (Go, g++, Catch2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ catch2 pkg-config golang-go

      - name: Configure cache
        uses: Swatinem/rust-cache@v2

      - name: Set default keys if missing
        shell: bash
        run: |
          echo "PROGRESS_KEY=${PROGRESS_KEY:-01234567890123456789012345678901}" >> "$GITHUB_ENV"
          echo "ATTEST_KEY=${ATTEST_KEY:-12345678901234567890123456789012}" >> "$GITHUB_ENV"
          echo "SOLUTION_KEY=${SOLUTION_KEY:-abcdef0123456789abcdef0123456789}" >> "$GITHUB_ENV"

      - name: Warn if placeholder values are used
        shell: bash
        run: |
          [[ "${PROGRESS_KEY}" == "01234567890123456789012345678901" ]] && echo "::warning file=.github/workflows/ci.yml::PROGRESS_KEY is using the placeholder value"
          [[ "${ATTEST_KEY}" == "12345678901234567890123456789012" ]] && echo "::warning file=.github/workflows/ci.yml::ATTEST_KEY is using the placeholder value"
          [[ "${SOLUTION_KEY}" == "abcdef0123456789abcdef0123456789" ]] && echo "::warning file=.github/workflows/ci.yml::SOLUTION_KEY is using the placeholder value"

      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set default keys if missing
        shell: bash
        run: |
          echo "PROGRESS_KEY=${PROGRESS_KEY:-01234567890123456789012345678901}" >> "$GITHUB_ENV"
          echo "ATTEST_KEY=${ATTEST_KEY:-12345678901234567890123456789012}" >> "$GITHUB_ENV"
          echo "SOLUTION_KEY=${SOLUTION_KEY:-abcdef0123456789abcdef0123456789}" >> "$GITHUB_ENV"

      - name: Warn if placeholder values are used
        shell: bash
        run: |
          [[ "${PROGRESS_KEY}" == "01234567890123456789012345678901" ]] && echo "::warning file=.github/workflows/ci.yml::PROGRESS_KEY is using the placeholder value"
          [[ "${ATTEST_KEY}" == "12345678901234567890123456789012" ]] && echo "::warning file=.github/workflows/ci.yml::ATTEST_KEY is using the placeholder value"
          [[ "${SOLUTION_KEY}" == "abcdef0123456789abcdef0123456789" ]] && echo "::warning file=.github/workflows/ci.yml::SOLUTION_KEY is using the placeholder value"

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure cache
        uses: Swatinem/rust-cache@v2

      - name: Set default keys if missing
        shell: bash
        run: |
          echo "PROGRESS_KEY=${PROGRESS_KEY:-01234567890123456789012345678901}" >> "$GITHUB_ENV"
          echo "ATTEST_KEY=${ATTEST_KEY:-12345678901234567890123456789012}" >> "$GITHUB_ENV"
          echo "SOLUTION_KEY=${SOLUTION_KEY:-abcdef0123456789abcdef0123456789}" >> "$GITHUB_ENV"

      - name: Warn if placeholder values are used
        shell: bash
        run: |
          [[ "${PROGRESS_KEY}" == "01234567890123456789012345678901" ]] && echo "::warning file=.github/workflows/ci.yml::PROGRESS_KEY is using the placeholder value"
          [[ "${ATTEST_KEY}" == "12345678901234567890123456789012" ]] && echo "::warning file=.github/workflows/ci.yml::ATTEST_KEY is using the placeholder value"
          [[ "${SOLUTION_KEY}" == "abcdef0123456789abcdef0123456789" ]] && echo "::warning file=.github/workflows/ci.yml::SOLUTION_KEY is using the placeholder value"

      - name: Linting
        run: cargo clippy -- -D warnings

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure cache
        uses: Swatinem/rust-cache@v2

      - name: Set default keys if missing
        shell: bash
        run: |
          echo "PROGRESS_KEY=${PROGRESS_KEY:-01234567890123456789012345678901}" >> "$GITHUB_ENV"
          echo "ATTEST_KEY=${ATTEST_KEY:-12345678901234567890123456789012}" >> "$GITHUB_ENV"
          echo "SOLUTION_KEY=${SOLUTION_KEY:-abcdef0123456789abcdef0123456789}" >> "$GITHUB_ENV"

      - name: Warn if placeholder values are used
        shell: bash
        run: |
          [[ "${PROGRESS_KEY}" == "01234567890123456789012345678901" ]] && echo "::warning file=.github/workflows/ci.yml::PROGRESS_KEY is using the placeholder value"
          [[ "${ATTEST_KEY}" == "12345678901234567890123456789012" ]] && echo "::warning file=.github/workflows/ci.yml::ATTEST_KEY is using the placeholder value"
          [[ "${SOLUTION_KEY}" == "abcdef0123456789abcdef0123456789" ]] && echo "::warning file=.github/workflows/ci.yml::SOLUTION_KEY is using the placeholder value"

      - name: Build project
        run: cargo build --verbose --release

  cross-platform:
    name: Cross-platform build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure cache
        uses: Swatinem/rust-cache@v2

      - name: Set default keys if missing
        shell: bash
        run: |
          echo "PROGRESS_KEY=${PROGRESS_KEY:-01234567890123456789012345678901}" >> "$GITHUB_ENV"
          echo "ATTEST_KEY=${ATTEST_KEY:-12345678901234567890123456789012}" >> "$GITHUB_ENV"
          echo "SOLUTION_KEY=${SOLUTION_KEY:-abcdef0123456789abcdef0123456789}" >> "$GITHUB_ENV"

      - name: Warn if placeholder values are used
        shell: bash
        run: |
          [[ "${PROGRESS_KEY}" == "01234567890123456789012345678901" ]] && echo "::warning file=.github/workflows/ci.yml::PROGRESS_KEY is using the placeholder value"
          [[ "${ATTEST_KEY}" == "12345678901234567890123456789012" ]] && echo "::warning file=.github/workflows/ci.yml::ATTEST_KEY is using the placeholder value"
          [[ "${SOLUTION_KEY}" == "abcdef0123456789abcdef0123456789" ]] && echo "::warning file=.github/workflows/ci.yml::SOLUTION_KEY is using the placeholder value"

      - name: Build project
        run: cargo build --verbose
